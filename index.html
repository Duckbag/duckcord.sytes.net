<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Full Screen Embedded Website</title>
  <style>
    /* Remove default margin/padding and make html/body full height */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* prevent scrollbars */
      background: #000; /* optional background */
    }

    #window-container {
      position: fixed; /* fix to viewport */
      top: 0;
      left: 0;
      width: 100vw;  /* full viewport width */
      height: 100vh; /* full viewport height */
      border: none;
      background: white;
      display: flex;
      flex-direction: column;
    }

    #title-bar {
      background: #2f4f4f;
      color: white;
      padding: 8px 12px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      user-select: none;
      flex-shrink: 0; /* fixed height */
    }

    #embedded-site {
      flex-grow: 1; /* fill all remaining space */
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="window-container">
    <div id="title-bar">Ducky Voice Rooms</div>
    <iframe
      id="embedded-site"
      src="https://cd8a2480-e69c-41d5-9bea-a03bf3016bdd-00-2kg8bq2aoxto1.spock.replit.dev:3000/"
      allow="camera; microphone; fullscreen"
      allowfullscreen
    ></iframe>
  </div>
</body>
</html>
